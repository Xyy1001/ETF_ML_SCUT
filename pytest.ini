[pytest]
# Pytest配置文件

# 测试目录
testpaths = tests

# 输出设置
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --html=test-results/report.html
    --self-contained-html

# Playwright特定设置
# 使用chromium浏览器
# 可选: firefox, webkit
browser = chromium

# 标记
markers =
    slow: 标记慢速测试
    interaction: 标记交互测试
    api: 标记API测试
    ui: 标记UI测试
    smoke: 标记冒烟测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 最小Python版本
minversion = 7.0

# Python文件模式
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
