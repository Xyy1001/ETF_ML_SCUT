name: Website Interaction Test
run-name: ${{ github.actor }} 正在测试网站交互功能

on:
  push:
    branches: [ main, web ]
  pull_request:
    branches: [ main, web ]
  workflow_dispatch:  # 允许手动触发

jobs:
  test-website-interaction:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10']
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
      
      - name: 🐍 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install flask pandas numpy
          pip install playwright pytest pytest-playwright
          playwright install chromium
      
      - name: 🏗️ 创建测试模型文件
        run: |
          mkdir -p prediction/models
          mkdir -p risk\ control/models
          mkdir -p B-GNN
          echo "dummy model" > prediction/models/600519.pth
          echo "dummy model" > prediction/models/000001.pth
          echo "dummy gnn model" > B-GNN/gnn_model.pt
      
      - name: 🚀 启动Flask应用（后台）
        run: |
          cd G-Web
          python app.py &
          echo $! > flask.pid
          sleep 5
        env:
          FLASK_ENV: development
          SECRET_KEY: test-secret-key
      
      - name: 🧪 运行网站交互测试
        run: |
          pytest tests/test_website_interaction.py -v --headed
        continue-on-error: false
      
      - name: 📊 上传测试结果
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-results/
            screenshots/
      
      - name: 🛑 停止Flask应用
        if: always()
        run: |
          if [ -f G-Web/flask.pid ]; then
            kill $(cat G-Web/flask.pid) || true
          fi