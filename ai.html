<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能助手 | ETF-ML</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='ai.css') }}">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo"><svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                </svg><span class="logo-text">ETF-ML</span></div>
            <ul class="nav-menu">
                <li><a href="{{ url_for('index') }}" class="nav-link">首页</a></li>
                <li><a href="{{ url_for('data_page') }}" class="nav-link">数据展示</a></li>
                <li><a href="{{ url_for('models_page') }}" class="nav-link">模型展示</a></li>
                <li><a href="{{ url_for('backtest_page') }}" class="nav-link">回测分析</a></li>
                <li><a href="{{ url_for('ai_page') }}" class="nav-btn active">AI助手</a></li>
            </ul>
        </div>
    </nav>
    <div class="page-container">
        <div class="page-header">
            <h1 class="page-title"><svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>AI智能助手</h1>
            <p class="page-subtitle">智能问答 · 数据分析 · 报告生成</p>
        </div>
        <div class="main-grid">
            <div class="left-panel">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
                                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
                            </svg>知识库</div>
                    </div>
                    <div class="card-body">
                        <div class="knowledge-list" id="knowledgeList"></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <circle cx="12" cy="12" r="10" />
                                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                                <line x1="12" y1="17" x2="12.01" y2="17" />
                            </svg>快速问题</div>
                    </div>
                    <div class="card-body">
                        <div class="suggestions-list" id="suggestionsList"></div>
                    </div>
                </div>
            </div>
            <div class="right-panel">
                <div class="card chat-card">
                    <div class="card-header">
                        <div class="card-title"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path
                                    d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
                            </svg>智能对话</div>
                        <button class="icon-btn" onclick="clearChat()"><svg viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <path d="M3 6h18" />
                                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                            </svg></button>
                    </div>
                    <div class="chat-body">
                        <div class="chat-messages" id="chatMessages">
                            <div class="message ai-message">
                                <div class="message-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <path d="M12 2v20M2 12h20" />
                                    </svg></div>
                                <div class="message-content">
                                    <div class="message-text">你好！我是ETF-ML智能助手。我可以帮您：\n\n✓ 回答系统使用问题\n✓ 解释技术指标含义\n✓
                                        分析股票数据\n✓ 生成分析报告\n✓ 下载数据文件\n\n请问有什么可以帮您的吗？</div>
                                    <div class="message-time">刚刚</div>
                                </div>
                            </div>
                        </div>
                        <div class="chat-input-wrapper">
                            <form class="chat-input-form" id="chatForm">
                                <input type="text" id="chatInput" class="chat-input" placeholder="输入您的问题..."
                                    autocomplete="off">
                                <button type="submit" class="send-btn"><svg viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2">
                                        <line x1="22" y1="2" x2="11" y2="13" />
                                        <polygon points="22 2 15 22 11 13 2 9 22 2" />
                                    </svg></button>
                            </form>
                            <div class="input-tips">按回车发送消息</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='ai.js') }}"></script>
    <script src="{{ url_for('static', filename='mascot.js') }}"></script>
</body>

</html>
