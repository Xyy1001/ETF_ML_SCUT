<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型展示 | ETF-ML</title>
    <link rel="stylesheet" href="static/style.css">
    <style>
        .model-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .model-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2rem;
            transition: all 0.3s;
        }

        .model-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: var(--shadow-lg);
        }

        .model-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .model-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .model-desc {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .model-stats {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .stat-value {
            color: var(--primary-light);
            font-weight: 600;
        }

        .model-list {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 1rem;
        }

        .model-item {
            padding: 0.75rem 1rem;
            background: rgba(15, 15, 30, 0.5);
            border-radius: var(--radius-md);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo"><svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                </svg><span class="logo-text">ETF-ML</span></div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">首页</a></li>
                <li><a href="data.html" class="nav-link">数据展示</a></li>
                <li><a href="models.html" class="nav-link active">模型展示</a></li>
                <li><a href="backtest.html" class="nav-link">回测分析</a></li>
                <li><a href="ai.html" class="nav-btn">AI助手</a></li>
            </ul>
        </div>
    </nav>
    <div class="page-container">
        <div class="page-header">
            <h1 class="page-title"><svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
                </svg>模型展示</h1>
            <p class="page-subtitle">查看已训练的深度学习模型</p>
        </div>
        <div class="model-grid">
            <div class="model-card">
                <div class="model-icon">预测模型</div>
                <h2 class="model-title">LSTM+Transformer</h2>
                <p class="model-desc">长短期记忆网络结合Transformer自注意力机制，用于股票价格预测</p>
                <div class="model-stats">
                    <div class="stat-row"><span class="stat-label">已训练模型</span><span class="stat-value"
                            id="lstm-count">-</span></div>
                    <div class="stat-row"><span class="stat-label">输入窗口</span><span class="stat-value">60天</span></div>
                    <div class="stat-row"><span class="stat-label">预测长度</span><span class="stat-value">10天</span></div>
                    <div class="stat-row"><span class="stat-label">准确率</span><span class="stat-value">85%+</span></div>
                </div>
                <div class="model-list" id="lstm-list"></div>
            </div>
            <div class="model-card">
                <div class="model-icon">风险网络</div>
                <h2 class="model-title">图神经网络GNN</h2>
                <p class="model-desc">基于图注意力网络，预测股票间协方差矩阵和风险结构</p>
                <div class="model-stats">
                    <div class="stat-row"><span class="stat-label">模型状态</span><span class="stat-value"
                            id="gnn-status">-</span></div>
                    <div class="stat-row"><span class="stat-label">网络层数</span><span class="stat-value">3层GAT</span>
                    </div>
                    <div class="stat-row"><span class="stat-label">注意力头</span><span class="stat-value">8头</span></div>
                    <div class="stat-row"><span class="stat-label">输出维度</span><span class="stat-value">26×26矩阵</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        async function loadModels() {
            const res = await fetch('/api/models/summary');
            const data = await res.json();
            if (data.success) {
                document.getElementById('lstm-count').textContent = data.data.lstm.model_count;
                document.getElementById('gnn-status').textContent = data.data.gnn.model_exists ? '已训练' : '未训练';
                const list = document.getElementById('lstm-list');
                list.innerHTML = data.data.lstm.stock_list.slice(0, 10).map(s => `<div class="model-item">${s}.pth</div>`).join('');
            }
        }
        loadModels();
    </script>
    <div id="mascot-widget"></div>
    <script src="static/mascot.js"></script>
</body>

</html>
