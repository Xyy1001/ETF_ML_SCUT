<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据展示 | ETF-ML</title>
    <link rel="stylesheet" href="static/style.css">
    <link rel="stylesheet" href="static/data.css">
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                </svg>
                <span class="logo-text">ETF-ML</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">首页</a></li>
                <li><a href="data.html" class="nav-link active">数据展示</a></li>
                <li><a href="models.html" class="nav-link">模型展示</a></li>
                <li><a href="backtest.html" class="nav-link">回测分析</a></li>
                <li><a href="ai.html" class="nav-btn">AI助手</a></li>
            </ul>
        </div>
    </nav>

    <div class="page-container">
        <!-- 页面标题 -->
        <div class="page-header">
            <h1 class="page-title">
                <svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path
                        d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
                </svg>
                数据展示
            </h1>
            <p class="page-subtitle">查看原始股票数据和技术指标数据</p>
        </div>

        <!-- 数据概览 -->
        <div class="stats-overview">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-content">
                    <div class="stat-value" id="raw-stock-count">-</div>
                    <div class="stat-label">原始数据股票数</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📈</div>
                <div class="stat-content">
                    <div class="stat-value" id="indicator-stock-count">-</div>
                    <div class="stat-label">指标数据股票数</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📁</div>
                <div class="stat-content">
                    <div class="stat-value" id="raw-file-count">-</div>
                    <div class="stat-label">原始数据文件</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📂</div>
                <div class="stat-content">
                    <div class="stat-value" id="indicator-file-count">-</div>
                    <div class="stat-label">指标数据文件</div>
                </div>
            </div>
        </div>

        <!-- 主内容区 -->
        <div class="content-grid">
            <!-- 左侧：股票列表 -->
            <div class="sidebar-panel">
                <div class="panel-header">
                    <h2 class="panel-title">股票列表</h2>
                    <button class="refresh-btn" onclick="loadDataSummary()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M23 4v6h-6M1 20v-6h6" />
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                        </svg>
                    </button>
                </div>
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <path d="M21 21l-4.35-4.35" />
                    </svg>
                    <input type="text" id="stock-search" placeholder="搜索股票代码..." class="search-input">
                </div>
                <div class="stock-list" id="stock-list">
                    <div class="loading-placeholder">加载中...</div>
                </div>
            </div>

            <!-- 右侧：数据展示 -->
            <div class="main-panel">
                <div class="tabs-container">
                    <div class="tabs">
                        <button class="tab-btn active" data-tab="raw">原始数据</button>
                        <button class="tab-btn" data-tab="indicator">技术指标</button>
                    </div>
                </div>

                <div class="tab-content active" id="raw-data-tab">
                    <div class="data-info" id="raw-data-info">
                        <p class="info-text">👈 请从左侧选择股票查看原始数据</p>
                    </div>
                    <div class="data-table-wrapper" id="raw-table-wrapper" style="display: none;">
                        <div class="table-header">
                            <h3 class="table-title" id="raw-table-title">股票原始数据</h3>
                            <button class="download-btn" onclick="downloadData('raw')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                    <polyline points="7 10 12 15 17 10" />
                                    <line x1="12" y1="15" x2="12" y2="3" />
                                </svg>
                                下载CSV
                            </button>
                        </div>
                        <div class="table-scroll">
                            <table class="data-table" id="raw-data-table"></table>
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="indicator-data-tab">
                    <div class="data-info" id="indicator-data-info">
                        <p class="info-text">👈 请从左侧选择股票查看技术指标数据</p>
                    </div>
                    <div class="data-table-wrapper" id="indicator-table-wrapper" style="display: none;">
                        <div class="table-header">
                            <h3 class="table-title" id="indicator-table-title">技术指标数据</h3>
                            <button class="download-btn" onclick="downloadData('indicator')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                    <polyline points="7 10 12 15 17 10" />
                                    <line x1="12" y1="15" x2="12" y2="3" />
                                </svg>
                                下载CSV
                            </button>
                        </div>
                        <div class="indicator-legend">
                            <span class="legend-item">MA: 移动平均</span>
                            <span class="legend-item">MACD: 趋势指标</span>
                            <span class="legend-item">RSI: 相对强弱</span>
                            <span class="legend-item">BOLL: 布林带</span>
                            <span class="legend-item">KDJ: 随机指标</span>
                            <span class="legend-item">OBV: 能量潮</span>
                            <span class="legend-item">ATR: 真实波幅</span>
                        </div>
                        <div class="table-scroll">
                            <table class="data-table" id="indicator-data-table"></table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 看板娘占位 -->
    <div id="mascot-widget"></div>
    <script src="static/data.js"></script>
    <script src="static/mascot.js"></script>
</body>

</html>
