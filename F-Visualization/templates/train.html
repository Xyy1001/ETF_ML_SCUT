<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票预测系统 - ETF-ML</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='train.css') }}">
</head>

<body>
    <!-- 顶部导航 -->
    <nav class="top-nav">
        <a href="{{ url_for('index') }}" class="nav-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            </svg>
            首页
        </a>
        <a href="{{ url_for('data_page') }}" class="nav-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path
                    d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
            </svg>
            数据处理
        </a>
        <a href="{{ url_for('risk_page') }}" class="nav-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            </svg>
            风险控制
        </a>
    </nav>

    <div class="container">
        <!-- 页面标题 -->
        <header class="page-header">
            <h1 class="page-title">
                <svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z" />
                    <path d="M2 17l10 5 10-5M2 12l10 5 10-5" />
                </svg>
                股票预测系统
            </h1>
            <p class="page-subtitle">LSTM + Transformer 融合模型训练平台</p>
        </header>

        <!-- 主内容区 -->
        <div class="main-grid">
            <!-- 左侧：数据和模型状态 -->
            <div class="left-panel">
                <!-- 已有模型 -->
                <div class="panel model-panel">
                    <div class="panel-header">
                        <h2 class="panel-title">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
                            </svg>
                            已训练模型
                        </h2>
                        <button class="btn-refresh" id="refreshModels" title="刷新模型列表">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M23 4v6h-6M1 20v-6h6" />
                                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                            </svg>
                        </button>
                    </div>
                    <div class="model-list" id="modelList">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>加载模型列表中...</p>
                        </div>
                    </div>
                </div>

                <!-- 可用数据 -->
                <div class="panel data-panel">
                    <div class="panel-header">
                        <h2 class="panel-title">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                                <polyline points="14 2 14 8 20 8" />
                            </svg>
                            可用训练数据
                        </h2>
                        <button class="btn-refresh" id="refreshData" title="刷新数据列表">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M23 4v6h-6M1 20v-6h6" />
                                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                            </svg>
                        </button>
                    </div>
                    <div class="data-list" id="dataList">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>加载数据列表中...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧：训练配置和控制 -->
            <div class="right-panel">
                <!-- 训练配置 -->
                <div class="panel config-panel">
                    <div class="panel-header">
                        <h2 class="panel-title">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="3" />
                                <path
                                    d="M12 1v6m0 6v6M5.64 5.64l4.24 4.24m4.24 4.24l4.24 4.24M1 12h6m6 0h6M5.64 18.36l4.24-4.24m4.24-4.24l4.24-4.24" />
                            </svg>
                            训练配置
                        </h2>
                    </div>
                    <div class="config-content">
                        <!-- 选择数据文件 -->
                        <div class="form-group">
                            <label class="form-label">
                                <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path
                                        d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
                                </svg>
                                选择数据文件
                            </label>
                            <select id="dataSelect" class="form-select" required>
                                <option value="">请选择...</option>
                            </select>
                        </div>

                        <!-- 模型参数 -->
                        <div class="param-grid">
                            <div class="form-group">
                                <label class="form-label">训练轮数 (Epochs)</label>
                                <input type="number" id="epochs" class="form-input" value="100" min="1" max="1000">
                            </div>
                            <div class="form-group">
                                <label class="form-label">批次大小 (Batch Size)</label>
                                <input type="number" id="batchSize" class="form-input" value="32" min="1" max="256">
                            </div>
                            <div class="form-group">
                                <label class="form-label">学习率 (Learning Rate)</label>
                                <input type="number" id="learningRate" class="form-input" value="0.001" min="0.0001"
                                    max="1" step="0.0001">
                            </div>
                            <div class="form-group">
                                <label class="form-label">输入窗口</label>
                                <input type="number" id="inputWindow" class="form-input" value="100" min="10" max="200">
                            </div>
                            <div class="form-group">
                                <label class="form-label">输出窗口</label>
                                <input type="number" id="outputWindow" class="form-input" value="10" min="1" max="50">
                            </div>
                            <div class="form-group">
                                <label class="form-label">LSTM隐藏层大小</label>
                                    <input type="number" id="lstmHidden" class="form-input" value="64" min="16"
                                        max="256">
                            </div>
                        </div>

                        <!-- 训练按钮 -->
                        <button class="btn-train" id="startTrainBtn">
                            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <polygon points="5 3 19 12 5 21 5 3" />
                            </svg>
                            开始训练
                        </button>

                        <!-- 停止按钮（训练时显示）-->
                        <button class="btn-stop" id="stopTrainBtn" style="display: none;">
                            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="6" y="4" width="4" height="16" />
                                <rect x="14" y="4" width="4" height="16" />
                            </svg>
                            停止训练
                        </button>
                    </div>
                </div>

                <!-- 训练进度 -->
                <div class="panel progress-panel" id="progressPanel" style="display: none;">
                    <div class="panel-header">
                        <h2 class="panel-title">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="2" x2="12" y2="6" />
                                <line x1="12" y1="18" x2="12" y2="22" />
                                <line x1="4.93" y1="4.93" x2="7.76" y2="7.76" />
                                <line x1="16.24" y1="16.24" x2="19.07" y2="19.07" />
                                <line x1="2" y1="12" x2="6" y2="12" />
                                <line x1="18" y1="12" x2="22" y2="12" />
                                <line x1="4.93" y1="19.07" x2="7.76" y2="16.24" />
                                <line x1="16.24" y1="7.76" x2="19.07" y2="4.93" />
                            </svg>
                            训练进度
                        </h2>
                    </div>
                    <div class="progress-content">
                        <div class="progress-stats">
                            <div class="stat">
                                <span class="stat-label">当前Epoch</span>
                                <span class="stat-value" id="currentEpoch">0</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">总Epochs</span>
                                <span class="stat-value" id="totalEpochs">0</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">当前损失</span>
                                <span class="stat-value" id="currentLoss">-</span>
                            </div>
                        </div>
                        <div class="progress-bar-container">
                            <div class="progress-bar" id="trainingProgress"></div>
                        </div>
                        <div class="progress-percentage" id="progressPercentage">0%</div>
                    </div>
                </div>

                <!-- 训练日志 -->
                <div class="panel log-panel">
                    <div class="panel-header">
                        <h2 class="panel-title">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                                <polyline points="14 2 14 8 20 8" />
                                <line x1="16" y1="13" x2="8" y2="13" />
                                <line x1="16" y1="17" x2="8" y2="17" />
                                <polyline points="10 9 9 9 8 9" />
                            </svg>
                            训练日志
                        </h2>
                        <button class="btn-clear-log" id="clearLogBtn" title="清空日志">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6" />
                                <path
                                    d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                            </svg>
                        </button>
                    </div>
                    <div class="log-content" id="logContent">
                        <div class="log-empty">暂无训练日志</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast通知 -->
    <div class="toast" id="toast">
        <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <span class="toast-message" id="toastMessage"></span>
    </div>

    <script src="{{ url_for('static', filename='train.js') }}"></script>
</body>

</html>
