<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>风险控制系统 - ETF-ML</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='risk.css') }}">
</head>

<body>
    <!-- 顶部导航 -->
    <nav class="top-nav">
        <a href="{{ url_for('index') }}" class="nav-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            </svg>
            首页
        </a>
        <a href="{{ url_for('data_page') }}" class="nav-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path
                    d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
            </svg>
            数据处理
        </a>
        <a href="{{ url_for('train_page') }}" class="nav-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z" />
            </svg>
            股票预测
        </a>
    </nav>

    <div class="container">
        <!-- 页面标题 -->
        <header class="page-header">
            <h1 class="page-title">
                <svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                </svg>
                风险控制系统
            </h1>
            <p class="page-subtitle">基于GNN的协方差矩阵与相关系数矩阵预�?/p>
        </header>

        <!-- 主内容区 -->
        <div class="main-grid">
            <!-- 左侧面板 -->
            <div class="left-panel">
                <!-- 方法选择卡片 -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10" />
                                <path d="M12 6v6l4 2" />
                            </svg>
                            风险管理方法
                        </h3>
                        <button class="icon-btn" onclick="loadMethods()" title="刷新">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path
                                    d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2" />
                            </svg>
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="methodsList" class="methods-list">
                            <div class="loading">加载�?..</div>
                        </div>
                    </div>
                </div>

                <!-- 已训练模�?-->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
                            </svg>
                            已训练模�?
                        </h3>
                        <button class="icon-btn" onclick="loadModels()" title="刷新">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path
                                    d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2" />
                            </svg>
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="modelsList" class="models-list">
                            <div class="loading">加载�?..</div>
                        </div>
                    </div>
                </div>

                <!-- 训练数据 -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" />
                                <polyline points="13 2 13 9 20 9" />
                            </svg>
                            训练数据文件
                        </h3>
                        <button class="icon-btn" onclick="loadDataFiles()" title="刷新">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path
                                    d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2" />
                            </svg>
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="dataFilesList" class="data-files-list">
                            <div class="loading">加载�?..</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧面板 -->
            <div class="right-panel">
                <!-- 训练配置 -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="3" />
                                <path
                                    d="M12 1v6m0 6v6M5.64 5.64l4.24 4.24m4.24 4.24l4.24 4.24M1 12h6m6 0h6M5.64 18.36l4.24-4.24m4.24-4.24l4.24-4.24" />
                            </svg>
                            训练配置
                        </h3>
                    </div>
                    <div class="card-body">
                        <form id="trainForm">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="methodSelect">
                                        <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2">
                                            <path d="M3 3h18v18H3z" />
                                            <path d="M3 9h18M9 21V9" />
                                        </svg>
                                        风险管理方法
                                    </label>
                                    <select id="methodSelect" required>
                                        <option value="">请选择方法</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="epochs">
                                        <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2">
                                            <circle cx="12" cy="12" r="10" />
                                            <polyline points="12 6 12 12 16 14" />
                                        </svg>
                                        训练轮数 (Epochs)
                                    </label>
                                    <input type="number" id="epochs" min="1" max="1000" value="100" required>
                                </div>
                                <div class="form-group">
                                    <label for="batchSize">
                                        <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2">
                                            <rect x="3" y="3" width="7" height="7" />
                                            <rect x="14" y="3" width="7" height="7" />
                                            <rect x="14" y="14" width="7" height="7" />
                                            <rect x="3" y="14" width="7" height="7" />
                                        </svg>
                                        批次大小 (Batch Size)
                                    </label>
                                    <input type="number" id="batchSize" min="1" max="256" value="32" required>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="learningRate">
                                        <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2">
                                            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                                        </svg>
                                        学习�?(Learning Rate)
                                    </label>
                                    <input type="number" id="learningRate" step="0.0001" min="0.0001" max="1"
                                        value="0.001" required>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="lookback">
                                        <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2">
                                            <polyline points="15 18 9 12 15 6" />
                                        </svg>
                                        回溯窗口 (Lookback)
                                    </label>
                                    <input type="number" id="lookback" min="10" max="500" value="100" required>
                                </div>
                                <div class="form-group">
                                    <label for="horizon">
                                        <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2">
                                            <polyline points="9 18 15 12 9 6" />
                                        </svg>
                                        预测窗口 (Horizon)
                                    </label>
                                    <input type="number" id="horizon" min="1" max="100" value="10" required>
                                </div>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary" id="trainBtn">
                                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <polygon points="5 3 19 12 5 21 5 3" />
                                    </svg>
                                    开始训�?
                                </button>
                                <button type="button" class="btn btn-secondary" id="stopBtn" disabled>
                                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <rect x="6" y="4" width="4" height="16" />
                                        <rect x="14" y="4" width="4" height="16" />
                                    </svg>
                                    停止训练
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 训练进度 -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                                <polyline points="22 4 12 14.01 9 11.01" />
                            </svg>
                            训练进度
                        </h3>
                    </div>
                    <div class="card-body">
                        <div class="progress-container">
                            <div class="progress-info">
                                <span id="progressText">等待开�?..</span>
                                <span id="progressPercent">0%</span>
                            </div>
                            <div class="progress-bar">
                                <div id="progressFill" class="progress-fill"></div>
                            </div>
                            <div class="progress-stats">
                                <div class="stat-item">
                                    <span class="stat-label">当前轮次</span>
                                    <span class="stat-value" id="currentEpoch">0</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">总轮�?/span>
                                        <span class="stat-value" id="totalEpochs">0</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">当前损失</span>
                                    <span class="stat-value" id="currentLoss">-</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">预计剩余</span>
                                    <span class="stat-value" id="estimatedTime">-</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 训练日志 -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                                <polyline points="14 2 14 8 20 8" />
                                <line x1="16" y1="13" x2="8" y2="13" />
                                <line x1="16" y1="17" x2="8" y2="17" />
                                <polyline points="10 9 9 9 8 9" />
                            </svg>
                            训练日志
                        </h3>
                        <button class="icon-btn" onclick="clearLog()" title="清除日志">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6" />
                                <path
                                    d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                            </svg>
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="trainingLog" class="training-log"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='risk.js') }}"></script>
</body>

</html>
