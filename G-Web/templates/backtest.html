<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回测分析 | ETF-ML</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .backtest-container {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        .config-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2rem;
            height: fit-content;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-weight: 600;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 0.75rem;
            background: rgba(15, 15, 30, 0.8);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .run-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .run-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .results-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2rem;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .metric-card {
            background: rgba(15, 15, 30, 0.5);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            text-align: center;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .metric-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        .chart-container {
            background: rgba(15, 15, 30, 0.5);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .chart-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo"><svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                </svg><span class="logo-text">ETF-ML</span></div>
            <ul class="nav-menu">
                <li><a href="{{ url_for('index') }}" class="nav-link">首页</a></li>
                <li><a href="{{ url_for('data_page') }}" class="nav-link">数据展示</a></li>
                <li><a href="{{ url_for('models_page') }}" class="nav-link">模型展示</a></li>
                <li><a href="{{ url_for('backtest_page') }}" class="nav-link active">回测分析</a></li>
                <li><a href="{{ url_for('ai_page') }}" class="nav-btn">AI助手</a></li>
            </ul>
        </div>
    </nav>
    <div class="page-container">
        <div class="page-header">
            <h1 class="page-title"><svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <path d="M21.21 15.89A10 10 0 1 1 8 2.83" />
                    <path d="M22 12A10 10 0 0 0 12 2v10z" />
                </svg>回测分析</h1>
            <p class="page-subtitle">运行策略回测，评估投资组合性能</p>
        </div>
        <div class="backtest-container">
            <div class="config-panel">
                <h2 style="margin-bottom: 1.5rem; color: var(--text-primary);">回测配置</h2>
                <form id="backtest-form">
                    <div class="form-group">
                        <label class="form-label">股票池（多选）</label>
                        <select id="stock-select" class="form-select" multiple size="5">
                            <option value="000001.SZ">000001.SZ</option>
                            <option value="000063.SZ">000063.SZ</option>
                            <option value="000100.SZ">000100.SZ</option>
                            <option value="000157.SZ">000157.SZ</option>
                            <option value="000301.SZ">000301.SZ</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">开始日期</label>
                        <input type="date" id="start-date" class="form-input" value="2024-01-01">
                    </div>
                    <div class="form-group">
                        <label class="form-label">结束日期</label>
                        <input type="date" id="end-date" class="form-input" value="2024-12-31">
                    </div>
                    <div class="form-group">
                        <label class="form-label">风险厌恶系数 γ</label>
                        <input type="number" id="gamma" class="form-input" value="1.0" step="0.1" min="0">
                    </div>
                    <button type="submit" class="run-btn">运行回测</button>
                </form>
            </div>
            <div class="results-panel">
                <div id="loading" style="display: none; text-align: center; padding: 4rem; color: var(--text-muted);">
                    <p>回测运行中，请稍候...</p>
                </div>
                <div id="results" style="display: none;">
                    <h2 style="margin-bottom: 1.5rem; color: var(--text-primary);">回测结果</h2>
                    <div class="metrics-grid">
                        <div class="metric-card">
                            <div class="metric-value" id="total-return">-</div>
                            <div class="metric-label">累计收益率 (%)</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-value" id="sharpe">-</div>
                            <div class="metric-label">夏普比率</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-value" id="max-dd">-</div>
                            <div class="metric-label">最大回撤 (%)</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-value" id="annual-return">-</div>
                            <div class="metric-label">年化收益率 (%)</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-value" id="win-rate">-</div>
                            <div class="metric-label">胜率 (%)</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-value" id="volatility">-</div>
                            <div class="metric-label">波动率 (%)</div>
                        </div>
                    </div>
                    <div class="chart-container">
                        <div class="chart-title">净值曲线</div>
                        <canvas id="nav-chart"></canvas>
                    </div>
                </div>
                <div id="placeholder" style="text-align: center; padding: 4rem; color: var(--text-muted);">
                    <p>← 配置参数后点击"运行回测"开始分析</p>
                </div>
            </div>
        </div>
    </div>
    <script>
        let navChart = null;
        document.getElementById('backtest-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const stocks = Array.from(document.getElementById('stock-select').selectedOptions).map(o => o.value);
            if (stocks.length === 0) { alert('请选择至少一只股票'); return; }
            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('results').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            const response = await fetch('/api/backtest/run', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    stock_list: stocks,
                    start_date: document.getElementById('start-date').value,
                    end_date: document.getElementById('end-date').value,
                    gamma: parseFloat(document.getElementById('gamma').value)
                })
            });
            const result = await response.json();
            document.getElementById('loading').style.display = 'none';
            if (result.success) {
                document.getElementById('results').style.display = 'block';
                document.getElementById('total-return').textContent = result.data.metrics.total_return.toFixed(2);
                document.getElementById('sharpe').textContent = result.data.metrics.sharpe_ratio.toFixed(2);
                document.getElementById('max-dd').textContent = result.data.metrics.max_drawdown.toFixed(2);
                document.getElementById('annual-return').textContent = result.data.metrics.annual_return.toFixed(2);
                document.getElementById('win-rate').textContent = result.data.metrics.win_rate.toFixed(2);
                document.getElementById('volatility').textContent = result.data.metrics.volatility.toFixed(2);
                if (navChart) navChart.destroy();
                const ctx = document.getElementById('nav-chart').getContext('2d');
                navChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: result.data.dates,
                        datasets: [{
                            label: '净值',
                            data: result.data.nav_curve,
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { labels: { color: '#e0e0e0' } } },
                        scales: {
                            x: { ticks: { color: '#8b8ba7', maxTicksLimit: 10 }, grid: { color: 'rgba(102, 126, 234, 0.1)' } },
                            y: { ticks: { color: '#8b8ba7' }, grid: { color: 'rgba(102, 126, 234, 0.1)' } }
                        }
                    }
                });
            }
        });
    </script>
    <div id="mascot-widget"></div>
    <script src="{{ url_for('static', filename='mascot.js') }}"></script>
</body>

</html>
